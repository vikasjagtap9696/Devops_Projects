name_experiment: heart_disease_prediction

model:
  DecisionTreeClassifier_v1:
    model_name: 'DecisionTreeClassifier'
    preproc_strategy: 'tree'
    hyperparameters:
      max_depth: 5
      min_samples_split: 2
      min_samples_leaf: 1


  RandomForestClassifier_v1:
    model_name: 'RandomForestClassifier'
    preproc_strategy: 'tree'
    hyperparameters:
      n_estimators: 100
      max_depth: 5
      min_samples_split: 2
      min_samples_leaf: 1

  LogisticRegression_v1:
    model_name: 'LogisticRegression'
    preproc_strategy: 'linear'
    hyperparameters:
      C: 1.0
      max_iter: 100
      solver: 'lbfgs'
  
  SVC_v1:
    model_name: 'SVC'
    preproc_strategy: 'linear'
    hyperparameters:
      C: 1.0
      kernel: 'rbf'
      gamma: 'scale'
  

  GradientBoostingClassifier_v1:
    model_name: 'GradientBoostingClassifier'
    preproc_strategy: 'tree'
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      min_samples_split: 2
      min_samples_leaf: 1

  XGBClassifier_v1:
    model_name: 'XGBClassifier'
    preproc_strategy: 'tree'
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3

  KNN_v1:
    model_name: 'KNN'
    preproc_strategy: 'linear'
    hyperparameters:
      n_neighbors: 5
      weights: 'uniform'
      algorithm: 'auto'
  

  MLPClassifier_v1:
    model_name: 'MLPClassifier'
    preproc_strategy: 'linear'
    hyperparameters:
      hidden_layer_sizes: [100,]
      activation: 'relu'
      solver: 'adam'
      max_iter: 200
 